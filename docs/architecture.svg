<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1100" height="700" fill="#ffffff"/>
  <text x="550" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#14213d">SyncShield: regions can die, shoppers will not notice</text>

  <rect x="250" y="50" width="600" height="104" rx="12" fill="#fff7e6" stroke="#b45309" stroke-width="1.8"/>
  <text x="550" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Browser: shop UI + judge panel + SyncShield SDK</text>
  <g font-size="12.5" fill="#1f2937" text-anchor="middle">
    <text x="550" y="98">probe /healthz every 500 ms  ·  every write carries an op_id  ·  retry on the next node with the SAME op_id</text>
    <text x="550" y="118">outbox of signed events the nodes returned  ·  carried to a survivor via POST /v1/carry on failover</text>
    <text x="550" y="138">counters: errors shown, acknowledged, present on survivors (POST /v1/events/has), lost</text>
  </g>

  <path d="M390 154 L190 232" stroke="#0f766e" stroke-width="2.4" fill="none" marker-end="url(#t)"/>
  <text x="250" y="188" font-size="12" fill="#0f766e" font-weight="700">preferred node</text>
  <path d="M550 154 L550 232" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#a)"/>
  <text x="560" y="196" font-size="12" fill="#b45309" font-weight="700">failover + /v1/carry</text>
  <path d="M710 154 L910 232" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#a)"/>

  <g>
    <rect x="50" y="232" width="280" height="238" rx="12" fill="#e6f4f2" stroke="#0f766e" stroke-width="2"/>
    <rect x="50" y="232" width="280" height="36" rx="12" fill="#0f766e"/>
    <text x="190" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">MUMBAI  mum  :8001</text>
    <g font-size="12.5" fill="#1f2937" text-anchor="middle">
      <text x="190" y="290">write path v2: op_id idempotency</text>
      <text x="190" y="310">sign (Ed25519) · hash · HLC · seq</text>
      <text x="190" y="330">derive v1: policy per field + review</text>
      <text x="190" y="350">pull + push replication, link switch</text>
      <text x="190" y="370">/healthz  /v1/carry  /v1/events/has</text>
      <text x="190" y="390">/v1/status: level, heads, digests, carry</text>
      <text x="190" y="410">1 Uvicorn worker</text>
    </g>
  </g>
  <g>
    <rect x="410" y="232" width="280" height="238" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <rect x="410" y="232" width="280" height="36" rx="12" fill="#7c3aed"/>
    <text x="550" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">PUNE  pun  :8002</text>
    <g font-size="12.5" fill="#1f2937" text-anchor="middle">
      <text x="550" y="290">write path v2: op_id idempotency</text>
      <text x="550" y="310">sign (Ed25519) · hash · HLC · seq</text>
      <text x="550" y="330">derive v1: policy per field + review</text>
      <text x="550" y="350">pull + push replication, link switch</text>
      <text x="550" y="370">/healthz  /v1/carry  /v1/events/has</text>
      <text x="550" y="390">/v1/status: level, heads, digests, carry</text>
      <text x="550" y="410">1 Uvicorn worker</text>
    </g>
  </g>
  <g>
    <rect x="770" y="232" width="280" height="238" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
    <rect x="770" y="232" width="280" height="36" rx="12" fill="#c2410c"/>
    <text x="910" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">DELHI  del  :8003</text>
    <g font-size="12.5" fill="#1f2937" text-anchor="middle">
      <text x="910" y="290">same code, own database</text>
      <text x="910" y="310">joins empty, catches up from any</text>
      <text x="910" y="330">peer (relay), same digest at the end</text>
      <text x="910" y="360">started with REGIONS=mum,pun,del</text>
    </g>
  </g>

  <path d="M330 330 L410 330" stroke="#1d4ed8" stroke-width="2.4" fill="none" marker-start="url(#b)" marker-end="url(#b)"/>
  <path d="M690 330 L770 330" stroke="#1d4ed8" stroke-width="2.4" fill="none" marker-start="url(#b)" marker-end="url(#b)"/>
  <text x="370" y="320" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">pull+push</text>
  <text x="730" y="320" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">pull+push</text>
  <path d="M190 470 Q550 540 910 470" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="4 4" fill="none" marker-start="url(#b)" marker-end="url(#b)"/>
  <text x="550" y="520" text-anchor="middle" font-size="11.5" fill="#1d4ed8">full mesh (mum-del direct, events are also relayed)</text>

  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <rect x="115" y="486" width="150" height="34" rx="8" fill="#fff4dc" stroke="#b45309"/><text x="190" y="508">SQLite WAL  data/mum.db</text>
    <rect x="475" y="556" width="150" height="34" rx="8" fill="#fff4dc" stroke="#b45309"/><text x="550" y="578">SQLite WAL  data/pun.db</text>
    <rect x="835" y="486" width="150" height="34" rx="8" fill="#fff4dc" stroke="#b45309"/><text x="910" y="508">SQLite WAL  data/del.db</text>
  </g>
  <path d="M190 470 L190 486" stroke="#b45309" stroke-width="1.8"/>
  <path d="M550 470 L550 556" stroke="#b45309" stroke-width="1.8"/>
  <path d="M910 470 L910 486" stroke="#b45309" stroke-width="1.8"/>

  <rect x="50" y="612" width="300" height="62" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-dasharray="6 4"/>
  <text x="200" y="636" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Chaos agent :9000 (dev and demo only)</text>
  <text x="200" y="656" text-anchor="middle" font-size="11.5" fill="#1f2937">crash / start a node · tamper with one event</text>
  <path d="M350 640 Q430 600 474 578" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#r)"/>
  <path d="M120 612 L170 524" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#r)"/>

  <rect x="760" y="612" width="290" height="62" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="905" y="636" text-anchor="middle" font-size="13.5" font-weight="700" fill="#374151">Partner trust adapter (optional)</text>
  <text x="905" y="656" text-anchor="middle" font-size="11.5" fill="#4b5563">never on the local write path</text>

  <text x="550" y="692" text-anchor="middle" font-size="11.5" fill="#6b7280">A write is acknowledged only after commit. A browser can only help: it cannot edit, forge or reorder events (hash + signature checked).</text>
</svg>
